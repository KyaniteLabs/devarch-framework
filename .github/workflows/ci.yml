name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      run: |
        pytest -v

    - name: Run demo (basic smoke test)
      run: |
        devarch demo --force --build-db

    - name: Install and verify built wheel outside checkout
      if: matrix.python-version == '3.12'
      run: |
        python -m pip install build twine
        python -m build
        python -m twine check dist/*
        python -m pip uninstall -y devarch-framework
        python -m pip install --no-deps --force-reinstall dist/devarch_framework-0.4.1-py3-none-any.whl
        python scripts/check_installed_wheel.py

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint and format
      run: |
        ruff check .
        ruff format --check .

    - name: Check Python syntax
      run: |
        python -m py_compile archaeology/*.py
        python -m py_compile archaeology/**/*.py
