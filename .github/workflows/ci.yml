name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  hermes-plugin:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout plugin repository
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false

    - name: Checkout tested Hermes runtime
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        repository: NousResearch/hermes-agent
        ref: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19
        path: .hermes-runtime
        persist-credentials: false

    - name: Set up Python 3.14
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.14'

    - name: Set up Node.js for plugin checks
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '22'

    - name: Install uv
      uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

    - name: Install Hermes from its lockfile
      run: uv sync --frozen --python 3.14 --directory .hermes-runtime

    - name: Install test runner
      run: uv pip install --python .hermes-runtime/.venv/bin/python pytest==9.1.1

    - name: Run plugin tests against Hermes and fail on skips
      run: |
        set -o pipefail
        env -u HERMES_HOME HOME="$RUNNER_TEMP/ag4te-hermes-home" AG4TE_HERMES_SOURCE="$GITHUB_WORKSPACE/.hermes-runtime" .hermes-runtime/.venv/bin/python -m pytest plugins/ag4te-hermes/tests -q --tb=short -rs 2>&1 | tee hermes-plugin-tests.log
        if grep -Eq '[0-9]+ skipped' hermes-plugin-tests.log; then echo "::error::plugin tests were skipped"; exit 1; fi

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      run: |
        pytest -v

    - name: Run demo (basic smoke test)
      run: |
        devarch demo --force --build-db

    - name: Install and verify built wheel outside checkout
      if: matrix.python-version == '3.12'
      run: |
        python -m pip install build twine
        python -m build
        python -m twine check dist/*
        python -m pip uninstall -y devarch-framework
        python -m pip install --no-deps --force-reinstall dist/devarch_framework-0.4.1-py3-none-any.whl
        python scripts/check_installed_wheel.py

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint and format
      run: |
        ruff check .
        ruff format --check .

    - name: Check Python syntax
      run: |
        python -m py_compile archaeology/*.py
        python -m py_compile archaeology/**/*.py
