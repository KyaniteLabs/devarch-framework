name: Mutation
# Advisory Layer 2 lane: measures whether the tests actually detect injected
# defects in the era subsystem (archaeology/era_mapper.py, era_scanner.py,
# era_cascade.py). Not a required check (~6 min clean, slower under runner
# contention); the run goes red if the mutation score drops below 80%
# (baseline 83.4%, 2026-10-25), so a weakening of the tests is visible
# without blocking merges.
#
# The container is the org-standard node image (actions/checkout is a Node
# action and needs node in $PATH, exactly like the shared CI profile);
# Python 3.12 arrives via the same uv bootstrap the profile uses.
on:
  schedule:
    - cron: "07 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  mutation:
    name: mutation-score
    runs-on: docker
    timeout-minutes: 45
    container:
      image: node:26-bookworm@sha256:5c4012d11d9857c42713ba511fbc19645cac1706bb710d51d42b0d301dff7f88
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install pinned tools on Python 3.12 (uv bootstrap, as in CI)
        run: |
          apt-get update -qq && apt-get install -y -qq python3-venv
          python3 -m venv /tmp/uv-bootstrap
          /tmp/uv-bootstrap/bin/pip install --quiet uv==0.10.2
          /tmp/uv-bootstrap/bin/uv venv --python 3.12.12 .venv
          /tmp/uv-bootstrap/bin/uv pip install --python .venv pytest==9.1.1 mutmut==3.8.0
      - name: Mutation score of the era subsystem (break below 80%)
        run: |
          .venv/bin/mutmut run
          .venv/bin/mutmut export-cicd-stats
          .venv/bin/python - <<'PY'
          import json
          stats = json.load(open("mutants/mutmut-cicd-stats.json"))
          killed = stats["killed"]
          survived = stats["survived"]
          timeout = stats["timeout"]
          decided = killed + survived + timeout
          score = 100.0 * killed / decided if decided else 0.0
          print(f"gate evidence: mutation score {score:.1f}% "
                f"({killed} killed, {survived} survived, {timeout} timeout)")
          assert score >= 80.0, f"mutation score {score:.1f}% is below the 80% floor"
          PY
      - name: Retain the mutation stats
        if: ${{ always() }}
        uses: https://code.forgejo.org/forgejo/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3
        with:
          name: mutation-stats
          path: mutants/mutmut-cicd-stats.json
          if-no-files-found: warn
          retention-days: 30
