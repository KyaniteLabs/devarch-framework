name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Unique per push commit so queued main runs are never replaced; per PR otherwise.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    uses: KyaniteLabs/.github/.forgejo/workflows/ci-profile.yml@acc41fc663d5b1ef623a406fddff912823b29f93
